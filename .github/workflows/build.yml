# Сборка прошивки на каждый пуш. На тег вида v1.0 — ещё и GitHub Release
# с двумя файлами: общий (шить по USB на 0x0) и firmware.bin (по Wi-Fi, вкладка Update).
# Релиз можно сделать и без тега: Actions → build → Run workflow → release_tag = v1.1
# (тег создастся сам на собранном коммите).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.1); leave empty to just build'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Build
        run: pio run

      - name: Make merged image
        run: |
          B=.pio/build/t-embed-cc1101
          APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          mkdir -p dist
          esptool.py --chip esp32s3 merge_bin -o dist/radio_radar_full_0x0.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin dist/radio_radar_firmware_ota.bin
          (cd tools && zip -r ../dist/pc_monitor_windows.zip pc_monitor -x "*/__pycache__/*")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*

      # страница «прошить в одну кнопку» (GitHub Pages): страница + прошивка + описание для кнопки
      - name: Prepare flasher page
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          VER="${{ inputs.release_tag || github.ref_name }}"
          mkdir -p _site
          cp site/index.html _site/
          cp dist/radio_radar_full_0x0.bin _site/
          cat > _site/manifest.json <<JSON
          {
            "name": "Radio Radar",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "radio_radar_full_0x0.bin", "offset": 0 } ] }
            ]
          }
          JSON
          cat _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        with:
          path: _site

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Radio Radar ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.bin
            dist/*.zip
          generate_release_notes: true
          body: |
            **radio_radar_full_0x0.bin** — flash over USB at offset 0x0 (esptool-js / esptool), then power-cycle.
            **radio_radar_firmware_ota.bin** — upload over Wi-Fi: Web section → page → Update tab.
            **pc_monitor_windows.zip** — laptop monitor for the PC section: unzip, double-click start_pc_monitor.bat.

  flasher-page:
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
