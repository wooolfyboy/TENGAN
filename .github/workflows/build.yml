# Сборка прошивки на каждый пуш. На тег вида v1.0 — ещё и GitHub Release
# с двумя файлами: общий (шить по USB на 0x0) и firmware.bin (по Wi-Fi, вкладка Update).
# Релиз можно сделать и без тега: Actions → build → Run workflow → release_tag = v1.1
# (тег создастся сам на собранном коммите).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.1); leave empty to just build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Tablet page is up to date
        run: python tools/webapp/build.py --check

      - name: Build
        run: pio run

      - name: Make merged image
        run: |
          B=.pio/build/t-embed-cc1101
          APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          mkdir -p dist
          esptool.py --chip esp32s3 merge_bin -o dist/tengan_full_0x0.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin dist/tengan_firmware_ota.bin
          (cd tools && zip -r ../dist/pc_monitor_windows.zip pc_monitor -x "*/__pycache__/*")
          # прошивальщик в одном файле: открыть в Chrome → «Прошить палку»
          python tools/flasher/make_flasher.py dist/tengan_full_0x0.bin dist/flash_tengan.html "${{ inputs.release_tag || github.ref_name }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TENGAN ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.bin
            dist/*.zip
            dist/*.html
          generate_release_notes: true
          body: |
            **flash_tengan.html** — easiest: open in Chrome/Edge, press the button, pick the device. No addresses, settings are kept.
            **tengan_full_0x0.bin** — flash over USB at offset 0x0 (esptool-js / esptool), then power-cycle.
            **tengan_firmware_ota.bin** — upload over Wi-Fi: Web section → page → Update tab.
            **pc_monitor_windows.zip** — laptop monitor for the PC section: unzip, double-click start_pc_monitor.bat.
            **tengan_tablet.apk** — Android app for the tablet (same page as /full plus GPS): copy to the tablet, open, allow install.


  # Приложение для планшета (Android, app/): та же страница, что /full на палке, плюс GPS.
  # APK подписан постоянным ключом из репозитория — обновление ставится поверх старой версии.
  android:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web page + Capacitor sync
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run sync

      - name: Build APK
        working-directory: app/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/tengan_tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tablet-apk-${{ github.sha }}
          path: dist/tengan_tablet.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/tengan_tablet.apk
