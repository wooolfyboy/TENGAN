# Сборка прошивки на каждый пуш. На тег вида v1.0 — ещё и GitHub Release: полный образ (USB, 0x0),
# firmware для обновления по Wi-Fi и установщик-страница. Прошивка одна на оба языка
# (English / Русский выбирается на устройстве).
# Релиз можно сделать и без тега: Actions → build → Run workflow → release_tag = v1.1
# (тег создастся сам на собранном коммите).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.1); leave empty to just build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Tablet page is up to date
        run: python tools/webapp/build.py --check

      - name: Build
        run: pio run

      - name: Make image and installer
        run: |
          B=.pio/build/t-embed-cc1101
          APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          mkdir -p dist
          esptool.py --chip esp32s3 merge_bin -o dist/tengan_full_0x0.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin dist/tengan_firmware_ota.bin
          # установщик в одном файле (английский и русский на одной странице): открыть в Chrome/Edge → «Установить»
          python tools/flasher/make_flasher.py dist/tengan_full_0x0.bin dist/flash_tengan.html "${{ inputs.release_tag || github.ref_name }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TENGAN ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.bin
            dist/*.html
          generate_release_notes: true
          body: |
            ## Install

            One firmware for both languages: choose **English** or **Русский** on the device at first start (later: Settings › Language). Your settings are kept when you update.

            | File | What it is |
            |---|---|
            | **flash_tengan.html** | The easiest way to install. Open it in Chrome or Edge, press *Install firmware* and choose the device. |
            | **tengan_full_0x0.bin** | Full image for USB flashing at address 0x0 (esptool or esptool-js). |
            | **tengan_firmware_ota.bin** | Wireless update: Web section on the device → open the page → Update. |
            | **tengan_tablet.apk** | TENGAN Tablet for Android. Copy it to the tablet, open it and allow installation. |
            | **tengan_desktop.exe** | TENGAN Desktop for Windows: the dashboard and PC monitor, over USB or Wi-Fi. |

            ## Установка

            Одна прошивка на оба языка: **English** или **Русский** выбирается на устройстве при первом включении (потом — Настройки › Язык). Настройки при обновлении сохраняются.

            | Файл | Назначение |
            |---|---|
            | **flash_tengan.html** | Самый простой способ. Откройте файл в Chrome или Edge, нажмите «Установить прошивку» и выберите устройство. |
            | **tengan_full_0x0.bin** | Полный образ для прошивки по USB с адреса 0x0 (esptool или esptool-js). |
            | **tengan_firmware_ota.bin** | Обновление по Wi-Fi: раздел «Веб» на устройстве → открыть страницу → «Обновление». |
            | **tengan_tablet.apk** | TENGAN Tablet для Android. Скопируйте на планшет, откройте и разрешите установку. |
            | **tengan_desktop.exe** | TENGAN Desktop для Windows: панель управления и монитор ПК, по USB или Wi-Fi. |


  # Приложение для планшета (Android, app/): та же страница, что /full на устройстве, плюс GPS.
  # APK подписан постоянным ключом из репозитория — обновление ставится поверх старой версии.
  android:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web page + Capacitor sync
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run sync

      - name: Build APK
        working-directory: app/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/tengan_tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tablet-apk-${{ github.sha }}
          path: dist/tengan_tablet.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/tengan_tablet.apk

  # Приложение для компьютера (Windows, tools/desktop): та же страница FULL + монитор ПК,
  # связь по USB-кабелю или по Wi-Fi устройства. Один файл tengan_desktop.exe.
  desktop:
    runs-on: windows-latest
    needs: firmware                  # релиз создаёт firmware — сюда только докладываем exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/desktop/requirements.txt pyinstaller

      - name: Check it imports
        run: python -c "import sys; sys.path.insert(0,'tools/pc_monitor'); sys.path.insert(0,'tools/desktop'); import webview, serial, psutil, tengan_desktop; print('ok')"

      - name: Build exe
        run: python tools/desktop/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-exe-${{ github.sha }}
          path: dist/tengan_desktop.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/tengan_desktop.exe
