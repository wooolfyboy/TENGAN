<style>:root{--bg:#05080d;--panel:#0e2a34;--line:#203240;--acc:#3ee6ff;--hot:#ebfaff;--label:#96afc0;--steel:#96afc0;--dim:#5a7080;--alert:#ff7a1a;
--ft:Rajdhani,'Arial Narrow',sans-serif;--f:'Share Tech Mono','JetBrains Mono',ui-monospace,monospace;--fc:'JetBrains Mono','Share Tech Mono',ui-monospace,monospace;
--bar:58px;--subs:44px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--hot);font:16px/1.35 var(--f);overflow:hidden;user-select:none;-webkit-user-select:none}
#bar{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:16px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(5,8,13,1),rgba(5,8,13,.85));z-index:5}
#bar::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:linear-gradient(90deg,var(--acc),rgba(62,230,255,.15))}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .nm{font:600 24px/1 var(--ft);color:var(--hot);letter-spacing:.06em}
#seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:24px;height:44px;background:var(--acc);color:var(--bg);font:400 16px/1 'Tengan Seal','Noto Sans CJK JP',sans-serif;-webkit-text-stroke:.6px var(--bg);clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,4px 100%,0 calc(100% - 4px));box-shadow:inset 0 0 0 1.5px var(--acc),inset 0 0 0 2.5px var(--bg)}
#seal i{font-style:normal;display:block}
#nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
#nav button,#subs button,.btn{flex:0 0 auto;background:transparent;color:var(--label);border:1px solid transparent;padding:8px 14px 7px;font:600 18px/1 var(--ft);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
#nav button:hover{color:var(--hot)}
#nav button.on{color:var(--hot);border-color:var(--acc);background:rgba(62,230,255,.1)}
#nav button.on::before{content:'// ';color:var(--acc)}
.stat{display:flex;align-items:center;gap:14px;color:var(--label);font-size:13px;letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
#radios{display:flex;gap:8px}#radios i{font-style:normal;color:var(--dim)}#radios i.on{color:var(--acc)}
#gps{color:var(--dim)}#gps.on{color:var(--acc)}#gps:empty{display:none}
#clock{font:600 20px/1 var(--ft);color:var(--hot)}
.dot{width:9px;height:9px;transform:rotate(45deg);background:var(--dim)}
.dot.live{background:var(--acc);box-shadow:0 0 10px var(--acc)}.dot.poll{background:var(--label)}.dot.off{background:var(--alert)}
#fs{background:none;border:1px solid var(--line);color:var(--acc);font:inherit;font-size:18px;padding:3px 10px;cursor:pointer}
#subs{position:fixed;top:var(--bar);left:0;right:0;height:var(--subs);display:flex;gap:4px;align-items:center;padding:0 max(16px,env(safe-area-inset-left));z-index:4;pointer-events:none}
#subs:empty{display:none}
#subs button{pointer-events:auto;padding:6px 12px 5px;font-size:15px;background:rgba(5,8,13,.6)}
#subs button.on{color:var(--acc);border-color:rgba(62,230,255,.45)}
#main{position:fixed;top:var(--bar);left:0;right:0;bottom:0}
.view{position:absolute;inset:0}
.stage{position:absolute;inset:0;min-width:0;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#wipe{position:fixed;left:0;right:0;top:0;height:3px;background:var(--hot);box-shadow:0 0 18px var(--acc),0 -2px 0 var(--acc),0 2px 0 var(--acc);opacity:0;pointer-events:none;z-index:6}
#wipe.go{animation:wipe .38s cubic-bezier(.2,.7,.3,1)}
@keyframes wipe{0%{opacity:1;transform:translateY(var(--bar))}90%{opacity:1}100%{opacity:0;transform:translateY(100vh)}}
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);transition:opacity .35s}
#boot.done{opacity:0;pointer-events:none}
#boot canvas{width:100%;height:100%;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9}
#modal .card{width:min(640px,92vw);max-height:84vh;overflow:auto;background:rgba(10,20,28,.95);border:1px solid var(--acc);padding:18px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.hide{display:none!important}
@media (max-width:1400px){#radios{display:none}#nav button{padding:8px 10px 7px;font-size:17px}}
@media (max-width:760px){.logo .nm{font-size:20px}#nav button{padding:7px 9px 6px;font-size:15px}#clock{display:none}}
@media (prefers-reduced-motion:reduce){#wipe.go{animation:none}}
html.sumi{--bg:#ece4d4;--panel:#e2d4c2;--line:#c9bfae;--acc:#1b1814;--hot:#1b1814;--label:#4a433b;--steel:#4a433b;--dim:#8a8174;--alert:#c23a2b;
--ft:'Noto Serif','Liberation Serif',Georgia,serif;color-scheme:light}
html.sumi body{background:var(--bg);color:var(--acc)}
html.sumi #bar{background:linear-gradient(180deg,rgba(236,228,212,1),rgba(236,228,212,.88))}
html.sumi #bar::after{height:2px;background:linear-gradient(90deg,var(--acc),rgba(27,24,20,.25) 70%,transparent);border-radius:1px}
html.sumi .logo .nm{font-family:var(--ft);font-weight:700;letter-spacing:.04em}
html.sumi #seal{background:var(--alert);box-shadow:inset 0 0 0 1.5px var(--alert),inset 0 0 0 2.5px var(--bg);-webkit-text-stroke:.6px var(--bg)}
html.sumi #nav button{color:var(--label);clip-path:none;border:0;border-bottom:3px solid transparent;font-family:var(--ft);font-weight:600;text-transform:none;letter-spacing:.02em}
html.sumi #nav button .kj{font:400 1.1em/1 'Tengan Seal',sans-serif;margin-right:.3em;color:var(--dim)}
html.sumi #nav button.on{color:var(--acc);background:transparent;border-color:var(--alert)}
html.sumi #nav button.on::before{content:''}
html.sumi #nav button.on .kj{color:var(--alert)}
html.sumi #subs button{background:rgba(236,228,212,.75);color:var(--label);clip-path:none;border:1px solid transparent;font-family:var(--ft);text-transform:none}
html.sumi #subs button.on{color:var(--acc);border-color:var(--acc)}
html.sumi .dot.live{background:var(--acc);box-shadow:none}
html.sumi #clock{font-family:var(--ft)}
html.sumi #wipe{background:var(--acc);box-shadow:0 0 14px rgba(27,24,20,.4)}
html.sumi #fs{color:var(--acc)}
html.sumi #modal .card{background:rgba(236,228,212,.97);border-color:var(--acc)}</style>

<header id="bar">
  <div class="logo"><span class="nm">TENGAN</span><span id="seal" aria-label="天眼"><i>天</i><i>眼</i></span></div>
  <nav id="nav"></nav>
  <div class="stat"><span id="radios"></span><span id="gps"></span><span id="link" class="dot"></span><span id="linkTxt">…</span><span id="bat"></span><span id="clock"></span><span id="fps"></span>
    <button id="fs" title="на весь экран" aria-label="на весь экран">⛶</button></div>
</header>
<div id="subs"></div>
<main id="main"></main>
<div id="wipe"></div>
<div id="boot"><canvas id="bootCv"></canvas></div>
<div id="modal" class="hide"><div class="card" id="modalCard"></div></div>

<script>const App = T.app = { cur: null };

document.getElementById('radios').innerHTML = names.map(([k, n]) => `<i class="${r.includes(k) ? 'on' : ''}">${n}</i>`).join('');
};
setInterval(() => { const d = new Date(); document.getElementById('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }, 1000);
App.renderSubs = () => {
const v = App.cur; subs.innerHTML = '';

(v.subs || []).forEach((n, i) => {
const b = T.el('button', i === v.sub ? 'on' : '', n);
